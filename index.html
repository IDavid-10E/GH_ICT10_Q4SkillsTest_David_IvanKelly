<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Skills Test</title>

    <py-config>
        packages = ["numpy", "matplotlib"]
    </py-config>
</head>

<body>

<div class="wrapper">

    <div class="tracker-card text-center">
        <h2 class="title">Attendance Tracker</h2>

        <select id="day" class="form-select mb-3">
            <option value="">Days</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
        </select>

        <input type="number" id="absent" class="form-control mb-3" placeholder="Absences">

        <div class="btn-group w-100">
            <button py-click="add_data" class="btn btn-success">Add</button>
            <button py-click="plot_graph" class="btn btn-primary">Graph</button>
            <button py-click="reset_all" class="btn btn-danger">Refresh</button>
        </div>

        <div id="msg" class="mt-3"></div>
    </div>
    <div id="graph" class="graph-box mt-4"></div>

</div>

<py-script src="main.py"></py-script>

</body>
</html>
